<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página no encontrada — Polplab</title>
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500&display=swap" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500&display=swap" /></noscript>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: rgb(246, 251, 255);
      --dark: rgb(14, 28, 41);
      --muted: rgba(14, 28, 41, 0.6);
      --accent: rgb(0, 153, 255);
    }
    body {
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 32px;
      background: var(--bg); color: var(--dark);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    .code {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: clamp(80px, 20vw, 160px); font-weight: 800;
      line-height: 1; letter-spacing: -.03em;
      color: var(--accent);
    }
    h1 {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: clamp(22px, 4vw, 30px); font-weight: 600;
      margin: 18px 0 10px;
    }
    p { color: var(--muted); font-size: 15px; max-width: 420px; line-height: 1.6; }
    a.btn {
      display: inline-block; margin-top: 28px;
      padding: 13px 26px; border-radius: 999px;
      background: var(--dark); color: #fff;
      font-size: 14px; font-weight: 600; text-decoration: none;
      transition: opacity .2s ease, transform .2s ease;
    }
    a.btn:hover { opacity: .88; transform: translateY(-1px); }
  </style>
</head>
<body>
  <div class="code">404</div>
  <h1>Esta página no existe</h1>
  <p>El enlace puede estar roto o la página se movió. Volvé al inicio y seguí desde ahí.</p>
  <a class="btn" href="/">Ir al inicio →</a>
</body>
</html>
